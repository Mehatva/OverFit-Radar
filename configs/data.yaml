# Data Configuration for Overfit Radar

date_range:
  start_date: "2010-01-01"
  end_date: "2026-04-01"

execution:
  timing: "t_plus_1_open"     # Signal computed at day t close, executed at day t+1 open
  risk_free_rate: 0.0          # Annualised Rf for daily excess returns (0.0 = pure alpha over cash)

storage:
  cache_dir: "data/raw"
  processed_dir: "data/processed"

provider:
  primary: "yfinance"
  rate_limit_pause_seconds: 0.5

# Liquid Nifty large-cap universe (Nifty 50 / Next 50 representatives)
# Note: Static snapshot. Historical survivorship limitation documented in docs/limitations.
